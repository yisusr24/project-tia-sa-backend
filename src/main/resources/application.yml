spring:
  application:
    name: inventario-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/tia_retail_db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true
    open-in-view: false

server:
  port: 8101
  servlet:
    context-path: /api
  error:
    include-message: always
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.tia.inventario: DEBUG
    org.springframework.jdbc.core: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true

app:
  import:
    max-file-size: 10485760
    max-records: 10000
    batch-size: 100
    timeout-seconds: 300
    allowed-formats: csv
    delimiter: ";"
    encoding: "UTF-8"
